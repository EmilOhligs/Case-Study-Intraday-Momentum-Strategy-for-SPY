[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "intraday_momentum"
version = "0.1.0"
description = "Replication and extension of Zarattini, Aziz & Barbon (2024): intraday momentum on SPY"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib", "pyarrow", "requests", "python-dotenv", "tabulate"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
